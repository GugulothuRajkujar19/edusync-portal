<div class="login-page">

  <!-- Header -->

  <div class="login-header">

    <div class="logo">
      🎓 MCA Student Portal
    </div>

    <div class="header-text">
      Faculty Portal
    </div>

  </div>


  <!-- Login Container -->

  <div class="login-container">

    <div class="login-box">

      <div class="login-icon">
        👨‍🏫
      </div>

      <h1>Faculty Login</h1>

      <p class="subtitle">
        Welcome back! Please login to continue.
      </p>


      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your Email">


      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your Password">


      <button
        type="button"
        (click)="goToFacultyDashboard()">
        Login →
      </button>


      <p class="back-text">
        Login as Student?
        <a routerLink="/student-login">Student Login</a>
      </p>

    </div>

  </div>

</div>
